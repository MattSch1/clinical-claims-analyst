# CI quality + PHI-safety gate (spec §13).
#
# quality-gate (every push/PR, hermetic, no secrets): lint + the full unit suite, which
#   INCLUDES the PHI-control tests (leakage scanner, views-only / aggregate-shape /
#   surrogate-key / system-catalog guards, append-only audit no-op, result-set scorer).
#   This is the always-on regression + PHI-safety gate.
#
# full-eval (manual dispatch): the result-set-accuracy + leakage gate against the
#   de-identified Postgres VIEWS end-to-end. Heavy (Java + Synthea + Postgres + a model
#   key), so it is opt-in. It generates a tiny synthetic population, bootstraps the views/
#   least-privilege role/audit, runs the eval, and FAILS if PHI leakage > 0 or result-set
#   accuracy drops below EVAL_MIN_ACCURACY (baseline - margin). Needs an OPENAI_API_KEY
#   repo secret.
name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (project + dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit + PHI-control tests (leakage gate · guards · scorers)
        run: pytest -q

  full-eval:
    # Opt-in end-to-end accuracy + leakage gate (needs the OPENAI_API_KEY secret).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analytics"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_BACKEND: postgres
      LANGFUSE_ENABLED: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANALYTICS_OWNER_DSN: postgresql://analytics:analytics@127.0.0.1:5433/analytics
      ANALYST_RO_DSN: postgresql://analyst_ro:analyst_ro_ci_pw@127.0.0.1:5433/analytics
      AUDIT_WRITER_DSN: postgresql://audit_writer:audit_writer_ci_pw@127.0.0.1:5433/analytics
      ANALYST_RO_PASSWORD: analyst_ro_ci_pw
      AUDIT_WRITER_PASSWORD: audit_writer_ci_pw
      EVAL_MIN_ACCURACY: "0.45"   # baseline (~0.60) minus margin; tune as the dataset grows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate a tiny Synthea population + load CSVs
        run: python -m src.data.load --patients 120 --seed 12345
      - name: Bootstrap de-identified views + least-privilege role + audit
        run: python -m src.data.bootstrap_pg
      - name: Validate the LLM judge (Cohen's kappa)
        run: python eval/judge_validation.py
      - name: Eval gate (fails on accuracy regression OR any PHI leakage)
        run: python eval/run_eval.py
