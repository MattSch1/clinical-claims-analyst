# Render blueprint (deploy template). The app is a stateless Docker web service; it
# needs a managed Postgres (Neon/Supabase free tier — bootstrap the de-identified views
# into it ONCE from your machine: `python scripts/bootstrap_cloud.py`), Langfuse Cloud
# (or a self-hosted instance) + an OpenAI key. Secrets are `sync: false` — set them in
# the dashboard; never commit real values.
#
# Deliberately NOT set on the service (bootstrap-only; least privilege — the runtime
# only ever uses the analyst_ro and audit_writer roles):
#   ANALYTICS_OWNER_DSN, ANALYST_RO_PASSWORD, AUDIT_WRITER_PASSWORD
services:
  - type: web
    name: clinical-claims-analyst
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATA_BACKEND
        value: postgres
      # Public-URL guardrails: bound token spend (per-IP/min + global daily cap → 429).
      - key: RATE_LIMIT_PER_MIN
        value: "10"
      - key: MAX_QUERIES_PER_DAY
        value: "500"
      - key: OPENAI_API_KEY
        sync: false
      # Managed-PG DSNs for the two LEAST-PRIVILEGE roles the bootstrap created
      # (append ?sslmode=require for Neon/Supabase):
      - key: ANALYST_RO_DSN
        sync: false
      - key: AUDIT_WRITER_DSN
        sync: false
      # Langfuse Cloud (or your self-hosted instance). LANGFUSE_PROJECT_ID must be the
      # real project id (the cuid in the project URL) or trace links 404.
      - key: LANGFUSE_HOST
        sync: false
      - key: LANGFUSE_PUBLIC_URL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PROJECT_ID
        sync: false
